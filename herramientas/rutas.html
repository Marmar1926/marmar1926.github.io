<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Generar recorrido</title>
<link rel="stylesheet" href="/assets/leaflet/leaflet.css">
<style>
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",sans-serif;background:#F6F1E7;color:#2B2620}
  header{padding:14px 16px 8px}
  h1{font-size:1.2rem;margin:0 0 4px}
  p{margin:0 0 8px;color:#6E665B}
  #map{height:62vh;min-height:320px;margin:0 16px;border-radius:8px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px}
  button{font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:8px;background:#2B2620;color:#fff;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  #st{font-weight:600}
  #legs{margin:0 16px 30px;padding:0;list-style:none;font-size:.85rem;columns:2 280px;column-gap:24px}
  #legs li{break-inside:avoid;padding:2px 0;border-bottom:1px solid #E2DACB;display:flex;justify-content:space-between;gap:8px}
  #legs li b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>Generar recorrido · <span id="vj">…</span></h1>
  <p>Esta página calcula el recorrido por las rutas reales, pasando por todas las paradas en orden. Cuando termine, revisalo en el mapa y tocá «Descargar recorrido». Después mandá ese archivo por el chat.</p>
</header>
<div id="map"></div>
<div class="bar">
  <span id="st">Calculando…</span>
  <button id="dl" disabled>Descargar recorrido</button>
</div>
<ol id="legs"></ol>
<script src="/assets/leaflet/leaflet.js"></script>
<script>
(function(){
  var viaje = (location.search.match(/viaje=([\w-]+)/) || [])[1] || '2018';
  document.getElementById('vj').textContent = 'viaje ' + viaje;
  var st = document.getElementById('st'), dl = document.getElementById('dl'), legsEl = document.getElementById('legs');
  var map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);
  var SERVERS = ['https://router.project-osrm.org/route/v1/driving/', 'https://routing.openstreetmap.de/routed-car/route/v1/driving/'];
  var CHUNK = 20, result = [], legs = [], paradas;

  function req(pts, k) {
    var coords = pts.map(function(p){ return p.lng.toFixed(5) + ',' + p.lat.toFixed(5); }).join(';');
    var url = SERVERS[k] + coords + '?overview=full&geometries=geojson&steps=false&continue_straight=false';
    return fetch(url).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ if (j.code !== 'Ok') throw new Error(j.code); return j.routes[0]; })
      .catch(function(e){ if (k + 1 < SERVERS.length) return req(pts, k + 1); throw e; });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  fetch('paradas-' + viaje + '.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    paradas = d.paradas;
    paradas.forEach(function(p, i){
      L.circleMarker([p.lat, p.lng], { radius: 4, color: '#fff', weight: 1, fillColor: '#2B2620', fillOpacity: 1 })
        .bindTooltip((i + 1) + '. ' + p.name).addTo(map);
    });
    map.fitBounds(paradas.map(function(p){ return [p.lat, p.lng]; }), { padding: [20, 20] });
    var chunks = [];
    for (var i = 0; i < paradas.length - 1; i += CHUNK - 1) chunks.push(paradas.slice(i, i + CHUNK));
    var n = 0, p = Promise.resolve();
    chunks.forEach(function(c, ci){
      p = p.then(function(){ st.textContent = 'Calculando tramo ' + (ci + 1) + ' de ' + chunks.length + '…'; return req(c, 0); })
        .then(function(route){
          var g = route.geometry.coordinates.map(function(x){ return [x[1], x[0]]; });
          if (result.length) g.shift();
          result = result.concat(g);
          L.polyline(g, { color: d.color || '#C00', weight: 4, opacity: .9 }).addTo(map);
          route.legs.forEach(function(l, li){ legs.push({ a: c[li].name, b: c[li + 1].name, km: l.distance / 1000 }); });
          return wait(1200); // pausa para no saturar el servidor gratuito
        });
    });
    p.then(function(){
      var tot = legs.reduce(function(s, l){ return s + l.km; }, 0);
      st.textContent = 'Listo: ' + Math.round(tot).toLocaleString('es-AR') + ' km en total.';
      legsEl.innerHTML = legs.map(function(l){ return '<li><span>' + l.a + ' → ' + l.b + '</span><b>' + Math.round(l.km) + ' km</b></li>'; }).join('');
      dl.disabled = false;
    }).catch(function(e){
      st.textContent = 'No se pudo calcular (' + e.message + '). Esperá un minuto y recargá la página.';
    });
  });

  function simplify(P, eps) { // Douglas-Peucker sin recursión profunda
    var keep = new Uint8Array(P.length); keep[0] = keep[P.length - 1] = 1;
    var stack = [[0, P.length - 1]];
    while (stack.length) {
      var s = stack.pop(), a = P[s[0]], b = P[s[1]], m = 0, mi = -1;
      for (var i = s[0] + 1; i < s[1]; i++) {
        var dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy, q = P[i];
        var dd = L2 ? Math.abs(dy * (a[0] - q[0]) - (a[1] - q[1]) * dx) / Math.sqrt(L2) : Math.hypot(q[0] - a[0], q[1] - a[1]);
        if (dd > m) { m = dd; mi = i; }
      }
      if (m > eps) { keep[mi] = 1; stack.push([s[0], mi], [mi, s[1]]); }
    }
    return P.filter(function(_, i){ return keep[i]; }).map(function(p){ return [+p[0].toFixed(5), +p[1].toFixed(5)]; });
  }
  dl.addEventListener('click', function(){
    var out = simplify(result, 0.0002);
    var blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'recorrido-' + viaje + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    st.textContent = 'Descargado: recorrido-' + viaje + '.json (' + out.length + ' puntos). Mandalo por el chat.';
  });
})();
</script>
</body>
</html>
