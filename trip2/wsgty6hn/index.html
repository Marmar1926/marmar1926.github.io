<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Clearwater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F7F2E7; --ink:#2B2620; --ink-soft:#6B6255; --accent:#2e7cf6; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    text-align:center; min-height:100vh; padding:0 0 70px;
  }
  .hero{ position:relative; width:100%; aspect-ratio:4/5; max-height:65vh; overflow:hidden; }
  .hero img{ width:100%; height:100%; object-fit:cover; display:block; }
  .content{ padding:28px 32px 0; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; margin-bottom:18px; }
  h1{ font-family:'Playfair Display', serif; font-size:1.8rem; margin:0 0 10px; }
  .location{ color:var(--ink-soft); font-size:1rem; margin:0 0 28px; }
  p.msg{ color:var(--ink-soft); font-size:0.95rem; max-width:32ch; margin:0 auto; line-height:1.5; }
  footer{ margin-top:36px; color:var(--ink-soft); font-size:0.8rem; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#1E1A14; --ink:#EDE6D8; --ink-soft:#B9AF9D; }
  }
  :root[data-theme="dark"]{ --paper:#1E1A14; --ink:#EDE6D8; --ink-soft:#B9AF9D; }
  .closing-cta{ display:inline-block; margin-top:26px; padding:10px 18px; border:1.5px solid var(--ink-soft); border-radius:20px; color:var(--accent); text-decoration:none; font-weight:600; font-size:0.88rem; }
  .topnav{ padding:14px 20px; font-size:0.85rem; text-align:left; }
  .topnav a{ color:var(--ink-soft); text-decoration:none; font-weight:600; }
  .prevnext{ display:flex; justify-content:space-between; gap:14px; max-width:640px; margin:28px auto 0; padding:0 26px; font-size:0.85rem; }
  .prevnext a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .prevnext a.next{ text-align:right; }
</style>
</head>
<body>
  <div class="topnav"><a href="/">← Índice</a></div>
  <div class="hero">
    <img src="hero.jpg" alt="Clearwater">
  </div>
  <div class="content">
    <span class="dot"></span>
    <h1>Clearwater</h1>
    <p class="location">Florida</p>
    <p class="msg">Estamos preparando las fotos y la historia de este lugar. Volvé a escanear más adelante.</p>
      <a class="closing-cta" href="/">Seguí explorando el mapa →</a>
  </div>
  <div class="prevnext">
    <a class="prev" href="/trip2/25fr6s4w/">← Hollywood of the South</a>
    <a class="next" href="/2018/uye2hff3/">Mount Rushmore Memorial →</a>
  </div>
  <footer>Punto #26 · Mis viajes por USA</footer>
</body>
</html>
